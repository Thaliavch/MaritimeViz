# .github/workflows/ci.yml
name: CI

on:
    push:
        branches: [ main ]
    pull_request:
        branches: [ main ]

jobs:
    test:
        runs-on: ubuntu-latest

        strategy:
            matrix:
                python-version: [ 3.11 ]

        steps:
            # grab the code
            -   uses: actions/checkout@v3

            # set up the Python version from our matrix
            -   name: Set up Python ${{ matrix.python-version }}
                uses: actions/setup-python@v4
                with:
                    python-version: ${{ matrix.python-version }}
                    cache: 'pip'                # cache pip downloads automatically

            # install dependencies
            -   name: Install dependencies
                run: |
                    python -m pip install --upgrade pip
                    pip install .[dev]
                    pip install tox-travis

            # run your test suite via tox
            -   name: Run tests
                run: tox
                env:
                    GFW_API_TOKEN: ${{ secrets.GFW_API_TOKEN }}

            # optionally can upload coverage to codecov
            # - name: Upload coverage to Codecov
            #   uses: codecov/codecov-action@v3
            #   with:
            #     token: ${{ secrets.CODECOV_TOKEN }}

    security:
        name: Security scan (Safety)
        runs-on: ubuntu-latest
        steps:
            -   uses: actions/checkout@v3
            -   name: Install Safety
                run: pip install safety
            -   name: Run Safety CLI to check for vulnerabilities
                uses: pyupio/safety-action@v1
                with:
                    api-key: ${{ secrets.SAFETY_API_KEY }}
