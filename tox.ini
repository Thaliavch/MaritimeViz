[tox]
envlist = py311, flake8
isolated_build = True

[testenv]
deps = -rrequirements_dev.txt
commands =
    python -m pip install --upgrade pip
    pytest --basetemp={envtmpdir}

[testenv:flake8]
deps = flake8
commands = flake8 src/maritimeviz tests

[flake8]
max-line-length = 100
exclude = .tox,build,dist
paths = src/maritimeviz tests
