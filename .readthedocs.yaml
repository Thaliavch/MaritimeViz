# Read the Docs configuration file
# See https://docs.readthedocs.io/en/stable/config-file/v2.html for details

version: 2

build:
  os: ubuntu-22.04
  tools:
    # tell RTD which Python to use
    python: "3.11"

python:
  install:
    # first install your docs‐only dependencies
    - requirements: docs/requirements.txt
    # then install your package itself (so Sphinx autodoc can import it)
    - method: pip
      path: .

sphinx:
  configuration: docs/source/conf.py
  # fail the build if any warnings occur
  fail_on_warning: true

formats:
  - htmlzip
  - pdf
  - epub
